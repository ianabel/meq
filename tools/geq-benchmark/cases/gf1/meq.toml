# MEQ ON THE MIRROR, PROFILE SHAPE "gf1": GF1 at n_e = 1e20, tapered (gf1.py).
#
# WRITTEN BY tools/geq-benchmark/gf1.py, which writes geq_gf1.py beside it
# from the same profiles. Edit gf1.py and re-run it; do not edit this file.
# From a run directory:
#
#     meq-run <this file>
#
# THE PROBLEM: tools/geq-benchmark/gf1.py's docstring, the one geq_gf1.py
# states in code. The electron density is given where each flux surface
# crosses z = 0 -- Gauge = "midplane" -- and the deuterons are Neutralising, as
# geq derives them; carbon is 0.55/30 of the electrons, Z_eff = 1.55.
# psi_inner is read at the electrode, psi_bnd at the limiter, and the
# taper takes the densities to 1e-6 of their peak at both, which is what leaves the
# source zero there under this gauge: a flat density alone would not, where
# omega does not vanish.

[mesh]
File = "mirror-gf1.msh"

[mesh.generate]
Tool = "halfdisc"
Radius = 3.4
Size = 0.4
PlasmaRMin = 0.0
PlasmaRMax = 0.75
PlasmaZMin = -1.5
PlasmaZMax = 1.5
PlasmaSize = 0.1
AlignPlasma = true

[discretisation]
PolynomialDegree = 2
# GF1's own stabilisation, tau = 30/max( R, 0.1 m ): at the box default
# tau0 = 3 the coarse rungs fold inside one element and do not solve from
# the vacuum (gf1.py's docstring; MEASUREMENTS.md M-345, M-347).
TauScaling = "diffusion"
Tau = 30.0

[solver]
NewtonRelativeTolerance = 1.0e-12
NewtonAbsoluteTolerance = 1.0e-14
NewtonMaxIterations = 30

[source]
Type = "rotating"
Normalised = true
ConfineToPlasma = true
SupportShape = "box"
AxialEdge = 1.5
Gauge = "midplane"
Mu0 = 1.2566370614359173e-06
GGPrime = 0.0
OmegaFile = "omega.dat"

[[source.species]]
Name = "electron"
Mass = 9.1093837139e-31
Charge = -1.0
TemperatureFile = "T_electron.dat"
TemperatureScale = 1.602176634e-19
DensityFile = "n_electron.dat"

[[source.species]]
Name = "deuterium"
Mass = 3.3435837768e-27
Charge = 1.0
TemperatureFile = "T_deuterium.dat"
TemperatureScale = 1.602176634e-19
Neutralising = true

[[source.species]]
Name = "carbon"
Mass = 2.00615026608e-26
Charge = 6.0
TemperatureFile = "T_carbon.dat"
TemperatureScale = 1.602176634e-19
DensityFile = "n_carbon.dat"

[boundary]
Type = "zero"

[boundary.electrode]
R = 0.1
Z = 0.0

[boundary.limiter]
R = 0.35
Z = 0.0

[boundary.exterior]
Radius = 3.0
Modes = 32

# geq's packs as geq carries them, ten filaments each at the radial centre,
# subtracted rather than meshed: examples/mirror-rotating.toml's machine.
[conductors]
Model = "filament"

[[coils]]
Name = "lower"
CentreR = 0.82078441790868473
CentreZ = -1.5
HalfWidth = 0.035284417908684695
HalfHeight = 0.5
Current = 5927782.2086590333
FilamentsR = 1
FilamentsZ = 10

[[coils]]
Name = "upper"
CentreR = 0.82078441790868473
CentreZ = 1.5
HalfWidth = 0.035284417908684695
HalfHeight = 0.5
Current = 5927782.2086590333
FilamentsR = 1
FilamentsZ = 10

[output]
Directory = "."
Prefix = "mirror-gf1"
GridNR = 129
GridNZ = 129
