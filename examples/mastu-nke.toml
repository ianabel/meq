# freegsnke's MAST-U FORWARD case (examples/example02), as MEQ solves it.
#
# GENERATED by tools/freegs4e-benchmark/mastu_meq_config.py -- edit that and
# regenerate rather than editing this, because the coil currents are
# AMPERE-TURNS derived from a filament count and the profile tables carry a
# ( psi_ax - psi_bnd ) from the chain rule. Both are easy to "correct" wrongly.
#
# The reference is mastu-fwd-<nx>x<ny>.npz from mastu_reference.py. Its own
# accuracy ceiling is about 1e-05 in psi_axis (MEASUREMENTS.md M-122), so
# agreement below that is the reference's noise.
#
# alpha_n = 1.2 makes the plasma edge a FRACTIONAL power, which caps the
# achievable order at k <= 1.2 -- see the generator's header.

[mesh]
File = "examples/mastu-nke.msh"

[mesh.generate]
Tool = "halfdisc"
Radius = 3.4
Size = 0.30
PlasmaRMin = 0.2608
PlasmaRMax = 1.8000
PlasmaZMin = -1.5099
PlasmaZMax = 1.4987
PlasmaSize = 0.06
CoilSize = 0.03

[boundary]
Type = "zero"

# THE TARGET NULL as an INITIAL VALUE of two unknowns, not a prescription:
# XP-3's border closes q_r = q_z = 0 and psi_bnd = psi_h( R_X, z_X ) on the
# same Newton, and the seed selects WHICH saddle is followed. This case is a
# DOUBLE NULL at identical flux, so either seed gives the same psi_bnd.
[boundary.xpoint]
R = 0.598480381433
Z = -1.097169646761

# Strictly inside [mesh.generate] Radius, which is what Gamma being the smaller
# semicircle within the generated disc means.
[boundary.exterior]
Radius = 3.0
CentreZ = 0.0
Modes = 10

# WHERE THE PLASMA IS, WHICH IS WHAT SELECTS THE BRANCH.
#
# MEQ builds the guess itself from this file's own [[coils]] and
# [source] PlasmaCurrent -- the vacuum field of the conductors, plus I_p spread
# over an ELLIPTICAL COLUMN about the axis named here. The semi-axes default to
# half of CentreR, circular, and MEASURED they need not be better than that:
# the tuned ellipse ( 0.50, 0.90 ) and the round default ( 0.425 ) reach the
# SAME psi_ax to every printed digit.
#
# **THE CONDUCTORS ALONE ARE NOT ENOUGH AND THAT IS MEASURED TOO.** Without
# CentreR this file converges in 9 iterations to psi_ax 3.258e-01 -- 3.5x the
# reference -- with its X-point 1.574 m from the seed and its axis at
# ( 2.65, -0.91 ), outside the machine. A guess describing no plasma finds a
# branch that is not one.
[initialguess]
Type = "conductors"
CentreR = 0.85
CentreZ = 0.0

[discretisation]
PolynomialDegree = 2

[solver]
# M-123: WITHOUT THIS THE BORDER SOLVE FAILS ON THIS MACHINE, and it is needed
# whether or not there is a guess. Cold it dies at iteration 0 with a singular
# bordered Jacobian; with the guess below it dies differently, at "no damping of
# the bordered Newton step gave a finite residual". The damping is scaled by the
# relative merit, so it vanishes as the solve converges and costs the quadratic
# endgame nothing -- the run it makes possible finishes 3.01e-02 -> 4.40e-11 ->
# 1.95e-15.
BorderRegularisation = 1.0e-3
NewtonMaxIterations = 200
NewtonRelativeTolerance = 1.0e-10
PlasmaSupportSweeps = 4

[source]
Type = "mhd"
Normalised = true
ConfineToPlasma = true
PsiAxis = 9.187209931e-02
PlasmaCurrent = 6.0000000000e+05
Mu0 = 1.25663706212e-06
PPrimeFile = "examples/mastu-nke-pprime.dat"
GGPrimeFile = "examples/mastu-nke-ggprime.dat"

[[coils]]
Name = "Solenoid"
CentreR = 0.194750000
