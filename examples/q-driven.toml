# DRIVING AN EQUILIBRIUM BY q( Psi ) -- ROADMAP.md item 10.
#
# Every other example in this directory PRESCRIBES the toroidal field, as
# [source] GGPrimeFile, and reports the safety factor as an output. A transport
# code hands an equilibrium code the other way round: q( Psi ) is the target and
# g( Psi ) is what has to be found. This file is that run.
#
# WHAT IT COSTS. g^2 is carried at knots that follow the mesh -- 19 here -- and
# a Gauss-Newton solves for its values with q matched at every knot, on the
# linearised solve's exact tangent: each step is one equilibrium and 2m + 1
# flux-surface extractions, and the extractions are most of the time. Each
# solve is warm-started from the last; the trace solver's symbolic
# factorisation is redone by each solve, reused only across its Newton steps.

[mesh]
RMin = 0.6
RMax = 1.4
ZMin = -0.6
ZMax = 0.6
NR = 8
NZ = 8
RefinementLevels = 1

[discretisation]
PolynomialDegree = 2
Tau = 1.0

[source]
Type = "mhd"

# psi_ax IS AN UNKNOWN AND HAS TO BE, because the profiles are functions of
# normalised flux. Required by SafetyFactorFile for that reason: without the
# normalisation there is no Psi for a target q to be a function of.
Normalised = true
PsiAxis = 0.30

Mu0 = 1.0
PPrimeFile = "q-driven-pprime.dat"

# THE TARGET, AND NOTE THAT THERE IS NO GGPrimeFile. The two are alternatives
# and naming both is refused: one prescribes the toroidal field and the other
# asks for whichever field delivers a given q, so a precedence rule would decide
# which physics the run did on the strength of key order -- and both spellings
# converge, to different equilibria.
SafetyFactorFile = "q-driven-q.dat"

# g^2 IS CARRIED AT KNOTS THAT FOLLOW THE MESH -- about two flux surfaces per
# element across the minor radius, a knot spacing from the axis and the edge --
# and q is matched at every one, so there is no degree or count to choose: the
# delivered q converges to this table as RefinementLevels and PolynomialDegree
# rise. The run prints how many knots it used.

# THE SCALE, AND THE RUN IS ILL-POSED WITHOUT IT. Equilibria with the same
# p( Psi ) and q( Psi ) form a one-parameter family -- q sets the pitch of the
# field lines and not the strength of the field, which is why VMEC wants
# PHIEDGE beside iota -- so exactly one more scalar selects the member, and
# naming none, or two, is refused. The three:
#
#   R0B0           g = R B_phi on the boundary [T m], the vacuum field the TF
#                  coils set. The loop opens at this constant g, gg' = 0.
#   ToroidalFlux   the toroidal flux inside the boundary [Wb], VMEC's PHIEDGE,
#                  held as the solved equilibrium's own int g/R dA.
#   PlasmaCurrent  I_p [A]. Here a condition of the outer loop: the profile
#                  scale stays one, so p is the table's.
#
# The other two want a ToroidalFieldGuess beside them to open the loop at.
#
# This target was built from g = 2.20 + 0.55 Psi, with Psi = 0 ON THE BOUNDARY
# (the source's Psi, one on the axis), so the boundary's g is 2.20.
R0B0 = 2.2

[boundary]
Type = "zero"

# A BUMP AND NOT A RAMP. The loop opens at gg' = 0, which is a weaker source
# than the answer, and a normalised source needs psi to be the right SIZE before
# Psi means anything -- the trivial branch is otherwise reachable and is a
# solution. The peak matches [source] PsiAxis.
[initialguess]
Type = "bump"
Amplitude = 0.30
CentreR = 1.0
CentreZ = 0.0
RadiusR = 0.4
RadiusZ = 0.6

[solver]
NewtonMaxIterations = 60
NewtonRelativeTolerance = 1.0e-12
NewtonAbsoluteTolerance = 1.0e-14

[output]
Directory = "."
Prefix = "q-driven"
GridNR = 65
GridNZ = 65

# THE ONE RUN THAT CAN REPORT ITS OWN q, AND THE ONLY ONE THAT MUST.
#
# Every other example prescribes g g', from which g -- and so the safety factor
# -- cannot be recovered without a constant of integration no key supplies, so
# their _surfaces.nc has no safety_factor column at all. Here the loop SOLVES
# for g^2 at its knots, so g is known, and the column is written.
#
# That makes the round trip readable off the output rather than taken on faith:
# this file's safety_factor against examples/q-driven-q.dat, which is the target
# the run was given.
FluxSurfaces = true
