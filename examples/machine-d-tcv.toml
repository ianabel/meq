[boundary]
Type = "zero"

# THE TARGET NULL, as an INITIAL VALUE of two unknowns rather than a
# prescription: XP-3's border closes q_r = q_z = 0 and
# psi_bnd = psi_h( r_X, z_X ) on the same Newton, and the seed selects
# WHICH saddle is followed.
#
# THIS IS THE SHAPE THE OPERATOR ASKED FOR and not the null the
# reference achieved, which is 1.1000 m away.  That distinction is the
# whole of what makes this a cold start.
[boundary.xpoint]
R = 0.750000000000
Z = -0.550000000000

[boundary.exterior]
Radius = 2.45
CentreZ = 0.0
Modes = 10

# NOT A NICETY.  A cold start on a free-boundary machine case wanders
# and does not converge; the guess is part of the problem statement.
# tools/freegs4e-benchmark/mkexactguess.py builds it by summing the
# reference's own Green's functions over MEQ's half-disc.
[initialguess]
Type = "gridfunction"
File = "examples/machine-d-tcv-guess.gf"
MeshFile = "examples/machine-d-tcv-guess.mesh"

[output]
Prefix = "machine-d-tcv"
GridNR = 129
GridNZ = 129
