[boundary]
Type = "zero"

# THE TARGET NULL, as an INITIAL VALUE of two unknowns rather than a
# prescription: XP-3's border closes q_r = q_z = 0 and
# psi_bnd = psi_h( r_X, z_X ) on the same Newton, and the seed selects
# WHICH saddle is followed.
#
# THIS IS THE SHAPE THE OPERATOR ASKED FOR and not the null the
# reference achieved, which is 0.0001 m away.  That distinction is the
# whole of what makes this a cold start.
[boundary.xpoint]
R = 1.200000000000
Z = -1.000000000000

[boundary.exterior]
Radius = 3.4
CentreZ = 0.0
Modes = 10

# AND THIS ONE IS COLD, WHICH IS THE DIFFERENCE FROM THE MESHED FILE.
# examples/machine-f-diiid.toml is handed mkexactguess.py's field, a
# Green's-function sum over the REFERENCE's own converged Jtor -- the
# right tool for "does MEQ land here" and the wrong one for anything
# timed, since the thing being looked for is already in the starting
# position.  This is mkcoldguess.py --remainder instead: the DESIGN
# plasma footprint carrying the target current, and no reference field
# anywhere in it.  Its peak is 57% from the answer.
#
# WHAT IS legitimately the user's is WHICH equilibrium: M-26 measures
# three converged solutions of one discrete problem 9.4% apart, so a free
# boundary has to be told which branch to find.  MEQ already takes that
# as [boundary.xpoint], [source] PsiAxis and PlasmaCurrent.  Needing a
# .gf on top of those is this solver owing the user a feature, and on
# this file it is a smaller debt than it was: the run below converges
# from a guess that knows only the machine's design.
[initialguess]
Type = "gridfunction"
File = "examples/machine-f-diiid-filament-guess.gf"
MeshFile = "examples/machine-f-diiid-filament-guess.mesh"

[conductors]
Model = "filament"

[output]
Prefix = "machine-f-diiid-filament"
GridNR = 129
GridNZ = 129
