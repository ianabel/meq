[boundary]
Type = "zero"

# THE TARGET NULL, as an INITIAL VALUE of two unknowns rather than a
# prescription: XP-3's border closes q_r = q_z = 0 and
# psi_bnd = psi_h( R_X, z_X ) on the same Newton, and the seed selects
# WHICH saddle is followed.
#
# THIS IS THE SHAPE THE OPERATOR ASKED FOR and not the null the
# reference achieved, which is 0.0001 m away.  That distinction is the
# whole of what makes this a cold start.
[boundary.xpoint]
R = 1.200000000000
Z = -1.000000000000

[boundary.exterior]
Radius = 3.4
CentreZ = 0.0
Modes = 10

# NOT A NICETY.  A cold start on a free-boundary machine case wanders
# and does not converge; the guess is part of the problem statement.
#
# IT IS COLD.  tools/freegs4e-benchmark/mkcoldguess.py builds it from
# the MACHINE -- the conductors and their currents, the target plasma
# current, and the shape the operator asked for -- and from nothing
# that was solved for.  mkexactguess.py is the OTHER one, which sums
# Green's functions over the reference's own converged Jtor; this
# comment named it for a while and was wrong, which matters: a run
# seeded from mkexactguess has the answer in the starting position,
# and is a different benchmark.
[initialguess]
Type = "gridfunction"
File = "examples/machine-f-diiid-shaped-guess.gf"
MeshFile = "examples/machine-f-diiid-shaped-guess.mesh"

[output]
Prefix = "machine-f-diiid-shaped"
GridNR = 129
GridNZ = 129
